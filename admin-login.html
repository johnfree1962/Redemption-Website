<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | Redemption Pharmacy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin-login.css">
    <script src="admin-auth.js"></script>
</head>
<body>
    <main class="auth-layout">
        <section class="auth-intro">
            <div class="auth-brand"><i class="fas fa-pills"></i><span>REDEMPTION<br>PHARMACY</span></div>
            <div><h1>Manage your pharmacy, securely.</h1><p>Sign in to update products, inventory, and the content customers see online.</p></div>
            <div class="security-note"><i class="fas fa-shield-halved"></i><span>Your session expires automatically after 30 minutes of inactivity.</span></div>
        </section>
        <section class="auth-form-panel">
            <form class="auth-form" id="adminLoginForm">
                <h2>Admin sign in</h2>
                <p class="subtle">Use your administrator credentials to continue.</p>
                <p class="auth-error" id="adminLoginError" role="alert" hidden></p>
                <div class="form-field"><label for="adminEmail">Email address</label><input id="adminEmail" name="email" type="email" autocomplete="username" placeholder="admin@redemptionpharmacy.com" required></div>
                <div class="form-field"><label for="adminPassword">Password</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
                <button class="auth-submit" type="submit"><i class="fas fa-lock"></i> Sign in to dashboard</button>
                <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> Return to pharmacy website</a>
            </form>
        </section>
    </main>
</body>
</html>
